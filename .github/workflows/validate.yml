name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check compares receipts.json against the base
          # commit, so the history has to be there to compare against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: End-to-end acceptance run
        run: python3 e2e_check.py

      - name: Validate the tree (secret gate, prices, addresses, states)
        run: python3 validate.py --no-write-stats

      - name: Append-only check against the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 validate.py --base "$BASE_SHA" --no-write-stats

      # The artifact whose whole purpose is being trustworthy without running
      # our code cannot be allowed to drift from the tree it describes. It is
      # rebuilt at its OWN generated_at, so the only thing that can move the
      # bytes is the repository itself.
      - name: The published verdict must recheck and still describe the tree
        run: |
          python3 verdict.py check --artifact feed/verdict.json
          python3 verdict.py build --root . --out "$RUNNER_TEMP/verdict.rebuilt.json" \
            --now "$(python3 -c 'import json; print(json.load(open("feed/verdict.json"))["generated_at"])')"
          diff -u feed/verdict.json "$RUNNER_TEMP/verdict.rebuilt.json" \
            || { echo "feed/verdict.json is stale; run 'python3 jobs_feed.py build' then 'python3 verdict.py build' and commit both"; exit 1; }

      - name: stats.json must match what validate.py generates
        run: |
          cp stats.json /tmp/stats.committed.json
          python3 validate.py
          diff -u /tmp/stats.committed.json stats.json \
            || { echo "stats.json is stale; run 'python3 validate.py' and commit the result"; exit 1; }

      # Same discipline as the verdict above: the file whose purpose is to be
      # checkable without running our code cannot drift from the verdict it
      # restates. `rpc` carries no clock of its own, so the diff is exact.
      - name: The published RPC bodies must match the published verdict
        run: |
          python3 proof_without_execution.py --self-test
          python3 proof_without_execution.py rpc --out "$RUNNER_TEMP/rpc.rebuilt.json"
          diff -u feed/rpc.json "$RUNNER_TEMP/rpc.rebuilt.json" \
            || { echo "feed/rpc.json is stale; run 'python3 proof_without_execution.py rpc' and commit it"; exit 1; }

      # The linter is worthless unless it runs on outbound text BEFORE it is
      # sent. On 2026-10-08 five comments we authored asked outside agents to
      # pipe a remote tarball into an interpreter; three of them refused, and
      # they were right. This step is what stops the next template doing it
      # again. The swarm-side half - linting every Moltbook comment before it
      # posts - is carded separately and is not this repository's to run.
      - name: No outbound draft may ask anyone to pipe remote code
        run: |
          status=0
          found=0
          for dir in drafts comments; do
            [ -d "$dir" ] || continue
            while IFS= read -r file; do
              found=$((found + 1))
              python3 proof_without_execution.py lint --file "$file" || status=1
            done <<< "$(find "$dir" -type f \( -name '*.md' -o -name '*.txt' -o -name '*.json' \))"
          done
          echo "linted $found outbound file(s)"
          exit $status
